          },
          error => {
            unsubscribe();
            reject(error);
          }

        .filter(category => typeof category.name === "string" && category.name.trim())

          const key = category.toLocaleLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .sort((first, second) => first.localeCompare(second));

      this.customCategories = customCategories;

     properties:{
      question:{type:"string"},
      options:{type:"array",items:{type:"string"}},
      answer:{type:"integer"}
     },
     required:["question","options","answer"],
     additionalProperties:false
    }
   }
  },
  required:["questions"],
  additionalProperties:false
 };
 const payload={
  model:"openai/gpt-oss-120b",
  messages:[
   {role:"system",content:"Create clear, factually correct multiple-choice quiz questions. Return only data matching the required JSON schema."},
   {role:"user",content:`Create exactly 10 clear, factually correct multiple-choice quiz questions about ${category}. Each question must have exactly four distinct answer options and one unambiguous correct answer. Vary concepts and difficulty. Set answer to the zero-based index of the correct option.`}
  ],
  response_format:{
   type:"json_schema",
   json_schema:{name:"quiz_questions",strict:true,schema}
  }
 };
 let response;
 for(let attempt=0;attempt<3;attempt++){
  response=await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",
   headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey.trim()}`},
   body:JSON.stringify(payload)
  });
  if(![429,500,502,503,504].includes(response.status)||attempt===2)break;
  const retryAfter=Number(response.headers.get("Retry-After"));
  const delay=Number.isFinite(retryAfter)&&retryAfter>0
   ?Math.min(retryAfter*1000,10000)
   :1000*(attempt+1);
  await new Promise(resolve=>setTimeout(resolve,delay));
 }
 let result;
 try{
  result=await response.json();
 }catch(error){
  throw new Error("Groq returned an unreadable response. Check your connection and API key.");
 }
 if(!response.ok){
  const detail=result?.error?.message||`Groq returned HTTP ${response.status}.`;
  if([429,500,502,503,504].includes(response.status)){
   throw new Error(`Groq is temporarily busy after automatic retries. ${detail} Please try again shortly.`);
  }
  throw new Error(detail);
 }
 let questions;
 try{
  const text=result?.choices?.[0]?.message?.content;
  if(typeof text!=="string"||!text.trim())throw new Error("Groq returned an empty response.");
  questions=JSON.parse(text).questions;
 }catch(error){
  throw new Error("Groq returned invalid quiz data. Try generating the quiz again.");
 }
 if(!Array.isArray(questions)||questions.length!==10||questions.some(question=>
  typeof question?.question!=="string"||!question.question.trim()
  ||!Array.isArray(question.options)||question.options.length!==4
  ||question.options.some(option=>typeof option!=="string"||!option.trim())
  ||new Set(question.options.map(option=>option.normalize("NFKC").toLocaleLowerCase())).size!==4
  ||!Number.isInteger(question.answer)||question.answer<0||question.answer>3
 )){
 throw new Error("Groq returned an incomplete quiz. Please try again.");
 }
 return questions;
}
async function loadQuiz(){
 clearInterval(timer);
 main.innerHTML=`<div class="empty-page"><h1>Preparing your quiz</h1><p class="muted">Groq is creating fresh questions for ${escapeHtml(category)}.</p></div>`;
 try{
  await QM.loadCategories();
  if(QM.categoryLoadError&&!QM.defaultCategories.includes(requestedCategory)){
   throw new Error("We couldn't verify this custom category. Check your connection and try again.");
  }
  category=QM.categories.includes(requestedCategory)?requestedCategory:"CSE";
  const authenticatedUser=await waitForAuthenticatedUser();
  if(!authenticatedUser||authenticatedUser.uid!==(u?.uid||u?.id)){
   localStorage.removeItem("qm_currentUser");
   location.href="login.html";
   return;
  }
  qs=await generateQuiz();
  idx=0;score=0;correct=0;wrong=0;
  render();
 }catch(error){
  console.error("Could not generate quiz:",error);
  const reason=error?.message||"Unknown error";
  main.innerHTML=`<div class="empty-page"><h1>Quiz unavailable</h1><p class="muted">We couldn't generate a fresh quiz right now.</p><p class="muted">${escapeHtml(reason)}</p><button class="btn btn-primary" id="retryQuiz">Try again</button></div>`;
  document.getElementById("retryQuiz").onclick=loadQuiz;
 }
}
function render(){
 clearInterval(timer); selected=false; time=15;
 const q=qs[idx],pct=((idx)/qs.length)*100;
 main.innerHTML=`<div class="quiz-wrap"><div class="quiz-head"><div><span class="eyebrow">${escapeHtml(category.toUpperCase())}</span><h1>Knowledge Challenge</h1></div><div class="timer" id="timer">00:${String(time).padStart(2,"0")}</div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="quiz-meta"><span>Question ${idx+1} of ${qs.length}</span><span>Score: ${score}</span></div><section class="question-card"><h2>${escapeHtml(q.question)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-i="${i}"><b>${String.fromCharCode(65+i)}</b><span>${escapeHtml(o)}</span></button>`).join("")}</div><div class="quiz-actions"><span class="muted">Select one answer</span><button class="btn btn-primary" id="next" disabled>${idx===qs.length-1?"Finish":"Next Question"} →</button></div></section></div>`;
 document.querySelectorAll(".option").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 document.getElementById("next").onclick=next; timer=setInterval(()=>{time--;document.getElementById("timer").textContent=`00:${String(Math.max(time,0)).padStart(2,"0")}`;if(time<=0){clearInterval(timer);answer(-1)}},1000);
}
function answer(i){
 if(selected)return;selected=true;clearInterval(timer);const q=qs[idx],buttons=document.querySelectorAll(".option");
 buttons.forEach((b,n)=>{b.disabled=true;if(n===q.answer)b.classList.add("correct");if(n===i&&i!==q.answer)b.classList.add("wrong")});
 if(i===q.answer){correct++;score+=10} else wrong++;
 document.getElementById("next").disabled=false;
}
function next(){if(!selected) return;idx++;if(idx<qs.length)render();else finish()}
function finish(){
 const result={id:crypto.randomUUID(),userId:u.id,userName:u.name,category,score,total:qs.length,correct,wrong,percent:Math.round(correct/qs.length*100),date:new Date().toISOString()};
 const rs=QM.results();rs.push(result);QM.saveResults(rs);localStorage.setItem("qm_lastResult",JSON.stringify(result));location.href="result.html";
}
loadQuiz();

</script>
