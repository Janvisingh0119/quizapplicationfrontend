<body class="app-body"><div id="app"></div><script>
const QM = {
  defaultCategories: ["CSE", "Java", "Python", "HTML", "CSS", "JavaScript", "Database", "Cloud"],
  categories: ["CSE", "Java", "Python", "HTML", "CSS", "JavaScript", "Database", "Cloud"],
  customCategories: [],
  categoryLoadError: null,
  async loadCategories() {
    this.categoryLoadError = null;
    this.customCategories = [];
    this.categories = [...this.defaultCategories];
    if (typeof firebase === "undefined" || typeof firebaseConfigured === "undefined" || !firebaseConfigured) {
      this.categoryLoadError = new Error("Firebase is not configured. Custom categories are unavailable.");
      console.error(this.categoryLoadError.message);
      return this.categories;
    }

    try {
      const auth = firebase.auth();
      const authenticatedUser = auth.currentUser || await new Promise((resolve, reject) => {
        let unsubscribe = () => {};
        unsubscribe = auth.onAuthStateChanged(
          user => {
            unsubscribe();
            resolve(user);
          },
          error => {
            unsubscribe();
            reject(error);
          }
        );
      });
      if (!authenticatedUser) throw new Error("Sign in to load custom categories.");

      const snapshot = await firebase.firestore().collection("categories").get();
      const seen = new Set(this.defaultCategories.map(category => category.toLocaleLowerCase()));
      const customCategories = snapshot.docs
        .map(documentSnapshot => documentSnapshot.data())
        .filter(category => typeof category.name === "string" && category.name.trim())
        .map(category => category.name.trim())
        .filter(category => {
          const key = category.toLocaleLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .sort((first, second) => first.localeCompare(second));

      this.customCategories = customCategories;
      this.categories = [...this.defaultCategories, ...customCategories];
    } catch (error) {
      console.error("Could not load custom quiz categories:", error);
      this.categoryLoadError = error;
      this.categories = [...this.defaultCategories];
    }

    return this.categories;
  },
  escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);
  },
  user() {
    return JSON.parse(localStorage.getItem("qm_currentUser") || "null");
  },
  requireAuth() {
    if (!this.user()) location.href = "login.html";
  },
  logout() {
    localStorage.removeItem("qm_currentUser");
    location.href = "login.html";
  },
  results() { return JSON.parse(localStorage.getItem("qm_results") || "[]"); },
  saveResults(r) { localStorage.setItem("qm_results", JSON.stringify(r)); },
  shell(active="home") {
    const u=this.user();
    const name=u?.name || "Learner";
    document.getElementById("app").innerHTML = `
      <div class="app-shell">
        <aside class="sidebar">
          <a class="brand" href="home.html"><span class="brand-mark">Q</span> QuizMaster</a>
          <div class="user-mini"><div class="avatar">${name[0].toUpperCase()}</div><div><b>${name}</b><small>${u?.role==="admin"?"Administrator":"Learner"}</small></div></div>
          <nav>
            <a class="${active==="home"?"active":""}" href="home.html">⌂ Dashboard</a>
            <a class="${active==="categories"?"active":""}" href="categories.html">▦ Categories</a>
            <a class="${active==="history"?"active":""}" href="history.html">◷ History</a>
            <a class="${active==="leaderboard"?"active":""}" href="leaderboard.html">♛ Leaderboard</a>
            <a class="${active==="profile"?"active":""}" href="profile.html">◎ Profile</a>
            ${u?.role==="admin"?`<a class="${active==="admin"?"active":""}" href="admin.html">⚙ Admin Panel</a>`:""}
          </nav>
          <button class="logout-btn" onclick="QM.logout()">↪ Logout</button>
        </aside>
        <main class="main-content">${document.getElementById("pageContent")?.innerHTML || ""}</main>
      </div>`;
  }
};

</script><script>
QM.requireAuth();
const r=JSON.parse(localStorage.getItem("qm_lastResult")||"null");
document.getElementById("app").innerHTML=`<div id="pageContent"></div>`;QM.shell();
document.querySelector(".main-content").innerHTML=r?`<div class="result-page"><span class="eyebrow">RESULT</span><h1>Quiz Completed! 🎉</h1><p class="muted">${r.category} • ${new Date(r.date).toLocaleString()}</p><div class="result-score"><strong>${r.percent}%</strong><span>${r.score} points</span></div><div class="result-stats"><div><b>${r.correct}</b><span>Correct</span></div><div><b>${r.wrong}</b><span>Wrong</span></div><div><b>${r.total}</b><span>Total</span></div></div><div class="hero-actions"><a class="btn btn-primary" href="quiz.html?category=${encodeURIComponent(r.category)}">Try Again</a><a class="btn btn-ghost" href="history.html">View History</a><a class="btn btn-ghost" href="leaderboard.html">Leaderboard</a></div></div>`:`<div class="empty">No result found. <a href="categories.html">Start a quiz</a></div>`;

</script></body>
</html>
