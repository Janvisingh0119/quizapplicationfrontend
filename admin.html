  <script>
const QM = {
  defaultCategories: ["CSE", "Java", "Python", "HTML", "CSS", "JavaScript", "Database", "Cloud"],
  categories: ["CSE", "Java", "Python", "HTML", "CSS", "JavaScript", "Database", "Cloud"],
  customCategories: [],
  categoryLoadError: null,
  async loadCategories() {
    this.categoryLoadError = null;
    this.customCategories = [];
    this.categories = [...this.defaultCategories];
    if (typeof firebase === "undefined" || typeof firebaseConfigured === "undefined" || !firebaseConfigured) {
      this.categoryLoadError = new Error("Firebase is not configured. Custom categories are unavailable.");
      console.error(this.categoryLoadError.message);
      return this.categories;
    }

    try {
      const auth = firebase.auth();
      const authenticatedUser = auth.currentUser || await new Promise((resolve, reject) => {
        let unsubscribe = () => {};
        unsubscribe = auth.onAuthStateChanged(
          user => {
            unsubscribe();
            resolve(user);
          },
          error => {
            unsubscribe();
            reject(error);
          }
        );
      });
      if (!authenticatedUser) throw new Error("Sign in to load custom categories.");

      const snapshot = await firebase.firestore().collection("categories").get();
      const seen = new Set(this.defaultCategories.map(category => category.toLocaleLowerCase()));
      const customCategories = snapshot.docs
        .map(documentSnapshot => documentSnapshot.data())
        .filter(category => typeof category.name === "string" && category.name.trim())
        .map(category => category.name.trim())
        .filter(category => {
          const key = category.toLocaleLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .sort((first, second) => first.localeCompare(second));

      this.customCategories = customCategories;
      this.categories = [...this.defaultCategories, ...customCategories];
    } catch (error) {
      console.error("Could not load custom quiz categories:", error);
      this.categoryLoadError = error;
      this.categories = [...this.defaultCategories];
    }

    return this.categories;
  },
  escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);
  },
  user() {
    return JSON.parse(localStorage.getItem("qm_currentUser") || "null");
  },
  requireAuth() {
    if (!this.user()) location.href = "login.html";
  },
  logout() {
    localStorage.removeItem("qm_currentUser");
    location.href = "login.html";
  },
  results() { return JSON.parse(localStorage.getItem("qm_results") || "[]"); },
  saveResults(r) { localStorage.setItem("qm_results", JSON.stringify(r)); },
  shell(active="home") {
    const u=this.user();
    const name=u?.name || "Learner";
    document.getElementById("app").innerHTML = `
      <div class="app-shell">
        <aside class="sidebar">
          <a class="brand" href="home.html"><span class="brand-mark">Q</span> QuizMaster</a>
          <div class="user-mini"><div class="avatar">${name[0].toUpperCase()}</div><div><b>${name}</b><small>${u?.role==="admin"?"Administrator":"Learner"}</small></div></div>
          <nav>
            <a class="${active==="home"?"active":""}" href="home.html">⌂ Dashboard</a>
            <a class="${active==="categories"?"active":""}" href="categories.html">▦ Categories</a>
            <a class="${active==="history"?"active":""}" href="history.html">◷ History</a>
            <a class="${active==="leaderboard"?"active":""}" href="leaderboard.html">♛ Leaderboard</a>
            <a class="${active==="profile"?"active":""}" href="profile.html">◎ Profile</a>
            ${u?.role==="admin"?`<a class="${active==="admin"?"active":""}" href="admin.html">⚙ Admin Panel</a>`:""}
          </nav>
          <button class="logout-btn" onclick="QM.logout()">↪ Logout</button>
        </aside>
        <main class="main-content">${document.getElementById("pageContent")?.innerHTML || ""}</main>
      </div>`;
  }
};

</script>
  <script>
const app = document.getElementById("app");

function showMessage(title, message, action = "") {
  app.innerHTML = `
    <div class="empty-page">
      <h1>${title}</h1>
      <p class="muted">${message}</p>
      ${action}
    </div>`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

function waitForAuthenticatedUser(auth) {
  if (auth.currentUser) return Promise.resolve(auth.currentUser);

  return new Promise((resolve, reject) => {
    let unsubscribe = () => {};
    unsubscribe = auth.onAuthStateChanged(
      user => {
        unsubscribe();
        resolve(user);
      },
      error => {
        unsubscribe();
        reject(error);
      }
    );
  });
}

function dateFor(value) {
  if (value && typeof value.toDate === "function") return value.toDate();
  if (!value) return null;
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? null : date;
}

function renderDirectory(users) {
  const search = document.getElementById("userSearch");
  const list = document.getElementById("userList");
  const count = document.getElementById("directoryCount");

  const renderRows = () => {
    const query = search.value.trim().toLocaleLowerCase();
    const matchingUsers = users.filter(user =>
      `${user.name} ${user.email}`.toLocaleLowerCase().includes(query)
    );
    count.textContent = `${matchingUsers.length} of ${users.length} profiles`;

    if (!matchingUsers.length) {
      list.innerHTML = `<div class="empty">${query ? "No profiles match your search." : "No user profiles found."}</div>`;
      return;
    }

    list.innerHTML = matchingUsers.map(user => {
      const joined = dateFor(user.createdAt);
      const joinedLabel = joined
        ? joined.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" })
        : "Date unavailable";
      const initial = escapeHtml(user.name.charAt(0).toUpperCase() || "?");
      const role = user.role === "admin" ? "Administrator" : "Learner";

      return `
        <div class="admin-user-row">
          <div class="admin-user-name">
            <span class="avatar">${initial}</span>
            <span><b>${escapeHtml(user.name)}</b><small>${escapeHtml(role)}</small></span>
          </div>
          <span class="admin-user-email">${escapeHtml(user.email)}</span>
          <span>${escapeHtml(joinedLabel)}</span>
        </div>`;
    }).join("");
  };

  search.addEventListener("input", renderRows);
  renderRows();
}

async function loadUserDirectory(database) {
  const refreshButton = document.getElementById("refreshUsers");
  const status = document.getElementById("adminStatus");
  const list = document.getElementById("userList");
  refreshButton.disabled = true;
  status.textContent = "Loading registered profiles...";
  list.innerHTML = `<div class="empty" role="status">Loading users...</div>`;

  try {
    const snapshot = await database.collection("users").get();
    const users = snapshot.docs.map(documentSnapshot => {
      const data = documentSnapshot.data();
      return {
        name: typeof data.name === "string" && data.name.trim() ? data.name.trim() : "Unnamed user",
        email: typeof data.email === "string" ? data.email : "Email unavailable",
        role: data.role,
        createdAt: data.createdAt
      };
    });
    users.sort((first, second) =>
      (dateFor(second.createdAt)?.getTime() || 0) - (dateFor(first.createdAt)?.getTime() || 0)
    );

    document.getElementById("userCount").textContent = String(users.length);
    status.textContent = `Firebase connected. ${users.length} registered profile${users.length === 1 ? "" : "s"} loaded.`;
    renderDirectory(users);
  } catch (error) {
    console.error("Could not load the admin user directory:", error);
    status.textContent = "Could not load user profiles. Check your Firestore rules and connection, then try again.";
    list.innerHTML = `<div class="empty" role="alert">The user directory is unavailable right now.</div>`;
    document.getElementById("directoryCount").textContent = "Unavailable";
  } finally {
    refreshButton.disabled = false;
  }
}

async function loadCategoryManager(database) {
  const refreshButton = document.getElementById("refreshCategories");
  const status = document.getElementById("categoryStatus");
  const list = document.getElementById("categoryList");
  refreshButton.disabled = true;
  status.textContent = "Loading categories...";

  try {
    const snapshot = await database.collection("categories").get();
    const seen = new Set(QM.defaultCategories.map(category => category.toLocaleLowerCase()));
    const categories = snapshot.docs
      .map(documentSnapshot => documentSnapshot.data())
      .filter(category => typeof category.name === "string" && category.name.trim())
      .map(category => category.name.trim())
      .filter(category => {
        const key = category.toLocaleLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .sort((first, second) => first.localeCompare(second));

    QM.customCategories = categories;
    QM.categories = [...QM.defaultCategories, ...categories];
    document.getElementById("categoryCount").textContent = String(QM.categories.length);
    status.textContent = `${categories.length} custom categor${categories.length === 1 ? "y" : "ies"} available to learners.`;
    list.innerHTML = categories.length
      ? categories.map(category => `<span class="admin-category-chip">${escapeHtml(category)}</span>`).join("")
      : `<span class="muted">No custom categories yet.</span>`;
    return true;
  } catch (error) {
    console.error("Could not load admin categories:", error);
    status.textContent = "Could not load categories. Check your Firestore rules and connection, then refresh.";
    list.innerHTML = `<span class="muted" role="alert">Custom categories are unavailable.</span>`;
    return false;
  } finally {
    refreshButton.disabled = false;
  }
}

async function addCategory(database, userId) {
  const form = document.getElementById("addCategoryForm");
  const input = document.getElementById("newCategoryName");
  const submitButton = form.querySelector("[type='submit']");
  const status = document.getElementById("categoryStatus");
  const name = input.value.trim().replace(/\s+/g, " ");

  if (!/^[A-Za-z0-9][A-Za-z0-9 &.+#()_-]{0,49}$/.test(name)) {
    status.textContent = "Use 1–50 letters or numbers; spaces and & . + # ( ) _ - are also allowed.";
    input.focus();
    return;
  }

  submitButton.disabled = true;
  status.textContent = "Checking for duplicates...";
  try {
    const snapshot = await database.collection("categories").get();
    const existingNames = [
      ...QM.defaultCategories,
      ...snapshot.docs.map(documentSnapshot => documentSnapshot.data().name).filter(name => typeof name === "string")
    ];
    if (existingNames.some(existing => existing.toLocaleLowerCase() === name.toLocaleLowerCase())) {
      status.textContent = "That category already exists. Choose a different name.";
      input.focus();
      return;
    }

    status.textContent = "Saving category...";
    const categoryId = encodeURIComponent(name.toLowerCase());
    await database.collection("categories").doc(categoryId).set({
      name,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdBy: userId
    });
    form.reset();
    const refreshed = await loadCategoryManager(database);
    status.textContent = refreshed
      ? `Added "${name}". Learners can now select it to generate AI questions.`
      : `Added "${name}", but the category list could not refresh. Use Refresh categories to try again.`;
  } catch (error) {
    console.error("Could not add quiz category:", error);
    status.textContent = "Could not add this category. Check your connection and Firestore rules, then try again.";
  } finally {
    submitButton.disabled = false;
  }
}

async function initializeAdmin() {
  if (typeof firebase === "undefined" || typeof firebaseConfigured === "undefined" || !firebaseConfigured) {
    showMessage(
      "Admin dashboard unavailable",
      "Firebase is not configured or could not be loaded. Check the Firebase setup and your connection."
    );
    return;
  }

  try {
    const auth = firebase.auth();
    const authenticatedUser = await waitForAuthenticatedUser(auth);
    if (!authenticatedUser) {
      showMessage(
        "Sign in required",
        "Sign in with an administrator account to access this page.",
        `<a class="btn btn-primary" href="login.html">Go to Login</a>`
      );
      return;
    }

    const database = firebase.firestore();
    const profileSnapshot = await database.collection("users").doc(authenticatedUser.uid).get();
    const profile = profileSnapshot.exists ? profileSnapshot.data() : null;
    if (profile?.role !== "admin") {
      showMessage(
        "Access denied",
        "Administrator privileges are required to view this page.",
        `<a class="btn btn-primary" href="home.html">Back Home</a>`
      );
      return;
    }

    const user = {
      id: authenticatedUser.uid,
      uid: authenticatedUser.uid,
      name: typeof profile.name === "string" && profile.name.trim()
        ? profile.name.trim()
        : authenticatedUser.displayName || "Administrator",
      email: profile.email || authenticatedUser.email || "",
      role: "admin"
    };
    localStorage.setItem("qm_currentUser", JSON.stringify(user));

    app.innerHTML = `<div id="pageContent"></div>`;
    QM.shell("admin");
    document.querySelector(".main-content").innerHTML = `
      <header class="topbar">
        <div>
          <span class="eyebrow">MANAGEMENT</span>
          <h1>Admin Dashboard</h1>
          <p class="muted">Monitor registered accounts and QuizMaster services.</p>
        </div>
        <button class="btn btn-primary" id="refreshUsers" type="button">Refresh data</button>
      </header>
      <section class="stat-grid admin-stat-grid" aria-label="Platform overview">
        <div class="stat-card"><span>Registered Users</span><strong id="userCount">—</strong><small>Firebase user profiles</small></div>
        <div class="stat-card"><span>Quiz Categories</span><strong id="categoryCount">${QM.categories.length}</strong><small>Available to learners</small></div>
        <div class="stat-card"><span>Question Generation</span><strong class="admin-stat-label">AI powered</strong><small>Questions are generated on demand</small></div>
      </section>
      <section class="admin-note">
        <b>Quiz activity reporting</b>
        <p>Quiz attempts are stored in each learner's browser. They are not available as a site-wide admin statistic.</p>
      </section>
      <section class="admin-directory admin-category-manager">
        <div class="section-head">
          <div><h2>Quiz categories</h2><p class="muted" id="categoryStatus" role="status">Preparing category manager...</p></div>
          <button class="btn btn-ghost" id="refreshCategories" type="button">Refresh categories</button>
        </div>
        <form class="admin-category-form" id="addCategoryForm">
          <label class="admin-search-label" for="newCategoryName">Add a category</label>
          <div class="admin-category-input-row">
            <input class="admin-search" id="newCategoryName" type="text" maxlength="50" placeholder="For example, Cybersecurity" required>
            <button class="btn btn-primary" type="submit">Add category</button>
          </div>
          <small class="muted">Learners can select each category to generate 10 fresh AI quiz questions.</small>
        </form>
        <div class="admin-category-list" id="categoryList"><span class="muted">Loading categories...</span></div>
      </section>
      <section class="admin-directory">
        <div class="section-head">
          <div><h2>User directory</h2><p class="muted" id="adminStatus" role="status">Connecting to Firebase...</p></div>
          <span class="admin-directory-count" id="directoryCount">Loading...</span>
        </div>
        <label class="admin-search-label" for="userSearch">Search users</label>
        <input class="admin-search" id="userSearch" type="search" placeholder="Search by name or email">
        <div class="admin-user-table">
          <div class="admin-user-header"><span>User</span><span>Email</span><span>Joined</span></div>
          <div id="userList"><div class="empty" role="status">Loading users...</div></div>
        </div>
      </section>`;

    document.getElementById("refreshUsers").addEventListener("click", () => loadUserDirectory(database));
    document.getElementById("refreshCategories").addEventListener("click", () => loadCategoryManager(database));
    document.getElementById("addCategoryForm").addEventListener("submit", event => {
      event.preventDefault();
      addCategory(database, authenticatedUser.uid);
    });
    await loadCategoryManager(database);
    await loadUserDirectory(database);
  } catch (error) {
    console.error("Could not initialize the admin dashboard:", error);
    showMessage(
      "Admin dashboard unavailable",
      "We could not verify your administrator profile. Check your connection and Firestore rules, then try again.",
      `<a class="btn btn-primary" href="admin.html">Try again</a>`
    );
  }
}

initializeAdmin();

</script>
